name: build and sign Rightly GPT

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Build the launcher from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./src/gpt/lib/Rightly.GptLauncher.ps1
          New-Item -ItemType Directory -Path ./dist -Force | Out-Null
          New-RightlyGptLauncher `
            -SourcePath ./src/gpt/Rightly.Gpt.Launcher.cs `
            -DestinationPath "./dist/Rightly GPT.exe" `
            -IconPath ./assets/rightly-gpt.ico | Out-Null

          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path "./dist/Rightly GPT.exe"))
          if ($info.ProductName -ne "Rightly GPT") {
            throw "Unexpected launcher product name: $($info.ProductName)"
          }
          if ($info.CompanyName -ne "Rightly") {
            throw "Unexpected launcher company name: $($info.CompanyName)"
          }
          if ($info.FileVersion -ne "1.1.0.0" -or $info.ProductVersion -ne "1.1.0.0") {
            throw "The workflow and launcher version metadata are out of sync."
          }
          if ($info.OriginalFilename -ne "Rightly GPT.exe") {
            throw "Unexpected original filename: $($info.OriginalFilename)"
          }

      - name: Upload unsigned provenance artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: Rightly-GPT-unsigned
          path: dist/Rightly GPT.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: signpath
        if: >-
          ${{ vars.SIGNPATH_ORGANIZATION_ID != '' &&
              vars.SIGNPATH_PROJECT_SLUG != '' &&
              vars.SIGNPATH_SIGNING_POLICY_SLUG != '' &&
              vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "1.1.0.0"

      - name: Upload signed launcher
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Rightly-GPT-signed
          path: signed/Rightly GPT.exe
          if-no-files-found: error
