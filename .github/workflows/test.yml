name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Static and behavior tests
        shell: pwsh
        run: |
          ./tests/verify-static.ps1
          ./tests/verify-package.ps1
          ./tests/verify-codex.ps1 -SkipInstalledBuild
          ./tests/verify-claude.ps1 -SkipInstalledBuild
          ./tests/chrome-install.test.ps1
      - name: Chrome extension layout tests
        shell: pwsh
        run: |
          npm ci --prefix tests --ignore-scripts
          if (-not (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe')) {
            npm exec --prefix tests -- playwright install chromium
          }
          npm run --prefix tests test:chrome
